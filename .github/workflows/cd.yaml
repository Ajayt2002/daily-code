name: Daily Code Deployment

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

#concurrency cancel previous runs on the same branch
concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

env:
    DOCKER_REGISTRY: docker.io
    IMAGE_NAMESPACE: ${{vars.DOCKERHUB_USERNAME}}

jobs:
    Test-And-Scan:
        runs-on: ubuntu-latest
        steps:
            -   name: Code Checkout
                uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
                with:
                    fetch-depth: 0 #complete history of all branches and tags
            -   name: Super-linter
                uses: super-linter/super-linter@v8.6.0 
                with:
                    exit-code: '0'
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    DISABLE_ERRORS: true
            -   name: Semgrep SAST
                uses: returntocorp/semgrep-action@v1
                with:
                    config: 'auto'
            -   name: GitLeaks Secret Scan
                if: ${{!env.ACT}}
                uses: gitleaks/gitleaks-action@v2
